<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clash Royale Sim</title>
<style>
  :root { --bg: #000; --panel: #1b2230; --text: #e8ecf3; --muted: #93a0b5; --elixir: #d43cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  #app { display: flex; height: 100%; }
  #stage { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #board { position: relative; flex: 1; width: 100%; min-height: 0; touch-action: none; }
  #board canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* simulator controls: hidden with ?clean */
  #panel, .hand { display: none; }
  body.dev #panel { display: flex; }
  body.dev .hand { display: flex; }
  /* game typefaces (loaded by the art bundle); white with a black outline and a hard drop shadow, like the client's labels */
  .gt { font-family: 'Supercell-Magic', system-ui, sans-serif; color: #fff; -webkit-text-stroke: 3px #000; paint-order: stroke fill;
        text-shadow: 0 2px 0 #000; letter-spacing: .01em; }
  .hand { gap: 6px; align-items: flex-end; padding: 6px 10px 8px; width: 100%; justify-content: center;
          background: linear-gradient(#b8322f, #7c1c1d 70%, #5c1213); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), 0 2px 0 #2a0707; }
  .card { position: relative; width: 60px; height: 74px; border-radius: 8px; background: #2c3650 center/contain no-repeat; border: 0; cursor: grab; display: flex; align-items: flex-end; justify-content: center; font-size: 10px; text-align: center; color: #fff; overflow: hidden; }
  .card.next { width: 40px; height: 50px; opacity: .9; cursor: default; }
  .card.disabled { filter: grayscale(1) brightness(.75); cursor: not-allowed; }
  .card.dragghost { position: fixed; pointer-events: none; opacity: .75; z-index: 10; transform: translate(-50%,-50%) scale(.8); }
  .card .cost { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--elixir); font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .card .name { padding: 2px; background: rgba(0,0,0,.35); width: 100%; }
  body.skinned .card { background-color: transparent; }
  .elixir { flex: 1; max-width: 170px; display: flex; flex-direction: column; gap: 2px; margin-left: 6px; }
  .elixir .bar { height: 18px; border-radius: 9px; background: #1d2a17; overflow: hidden; position: relative; box-sizing: border-box; }
  .elixir .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px;
                  background: linear-gradient(#f39cff, #d93cf7 45%, #a51fd0); box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
  .elixir .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(0,0,0,.4) calc(10% - 2px) 10%); }
  .elixir .num { font-size: 16px; }
  body.skinned .elixir .bar { background: none; border-radius: 0; overflow: visible; border-style: solid;
    border-image: var(--sk-time_bar_bg-img) var(--sk-time_bar_bg-slice) / var(--sk-time_bar_bg-w); border-width: var(--sk-time_bar_bg-w); }
  body.skinned .elixir .bar .fill, body.skinned .elixir .bar .ticks { inset: -2px 0; }

  #panel { width: 300px; padding: 10px; overflow-y: auto; flex-direction: column; gap: 12px;
           background: radial-gradient(120% 60% at 50% 0%, #3d86de, #2462b8 55%, #173f82); box-shadow: inset 3px 0 0 rgba(0,0,0,.35); }
  /* a section is a game popup: indigo title tab over the light popup body */
  .pop { display: flex; flex-direction: column; }
  .pop-title { padding: 7px 12px 9px; font-size: 16px; text-align: center; border-radius: 10px 10px 0 0; background: linear-gradient(#7465d8, #5643b7); }
  .pop-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-radius: 0 0 10px 10px;
              background: #e3eefa; box-shadow: inset 0 -4px 0 #a9bcd9; color: #24345a; }
  body.skinned .pop-title { background: none; border-radius: 0; border-style: solid; padding: 2px 4px 4px;
    border-image: var(--sk-bg_popup_01_2-img) var(--sk-bg_popup_01_2-slice) / var(--sk-bg_popup_01_2-w); border-width: var(--sk-bg_popup_01_2-w);
    border-bottom-width: 0; border-image-width: var(--sk-bg_popup_01_2-w); }
  body.skinned .pop-body { background: none; box-shadow: none; border-radius: 0; border-style: solid; padding: 0;
    border-image: var(--sk-bg_popup_01_1-img) var(--sk-bg_popup_01_1-slice) / var(--sk-bg_popup_01_1-w); border-width: var(--sk-bg_popup_01_1-w); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .hint { font: 13px/1.2 'SC CCBackBeat', system-ui, sans-serif; color: #4a5f88; }
  /* buttons: the game's btn_* (blue by default; data-sk picks green / orange / red / purple) */
  #panel button { font-family: 'Supercell-Magic', system-ui, sans-serif; font-size: 12px; color: #fff; -webkit-text-stroke: 3px #000;
    paint-order: stroke fill; text-shadow: 0 2px 0 #000; min-height: 36px; padding: 4px 12px 7px; cursor: pointer;
    border: 2px solid #10213d; border-radius: 8px; background: linear-gradient(#5ab4ff, #2d8cf0 60%, #1b62c4); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  #panel button[data-sk="green"] { background: linear-gradient(#6ff06a, #3ad13a 60%, #1f9a2b); }
  #panel button[data-sk="orange"] { background: linear-gradient(#ffd24a, #ffae1c 60%, #d97a00); }
  #panel button[data-sk="red"] { background: linear-gradient(#ff6b6b, #f03b3b 60%, #b81d22); }
  #panel button[data-sk="purple"] { background: linear-gradient(#d39bff, #a95cf0 60%, #7a2fc4); }
  body.skinned #panel button { background: none; box-shadow: none; border-radius: 0; border-style: solid;
    border-image: var(--sk-btn_blue-img) var(--sk-btn_blue-slice) / var(--sk-btn_blue-w); border-width: var(--sk-btn_blue-w); padding: 0 4px 2px; }
  body.skinned #panel button[data-sk="green"] { border-image-source: var(--sk-btn_green-img); }
  body.skinned #panel button[data-sk="orange"] { border-image-source: var(--sk-btn_orange-img); }
  body.skinned #panel button[data-sk="red"] { border-image-source: var(--sk-btn_red-img); }
  body.skinned #panel button[data-sk="purple"] { border-image-source: var(--sk-btn_purple-img); }
  #panel button:active { transform: translateY(2px); filter: brightness(.92); }
  /* toggles read as greyed out while off */
  #panel button.toggle:not(.on) { filter: grayscale(1) brightness(.8); }
  #panel input { width: 72px; font: 12px 'Supercell-Magic', system-ui, sans-serif; color: #24345a; background: #fff; border: 2px solid #8ea6cc;
                 border-radius: 8px; padding: 6px 8px; outline: none; }
  body.skinned #panel input { background: none; border-radius: 0; border-style: solid; padding: 2px 4px;
    border-image: var(--sk-bg_r20-img) var(--sk-bg_r20-slice) / var(--sk-bg_r20-w); border-width: var(--sk-bg_r20-w); }
  .lbl { display: flex; gap: 6px; align-items: center; font: 14px 'SC CCBackBeat', system-ui, sans-serif; color: #24345a; }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .palette .card { width: 100%; height: 76px; font-size: 9px; }
  .palette .card:hover { transform: translateY(-2px); }
  #status { font: 14px/1.35 'SC CCBackBeat', system-ui, sans-serif; color: #24345a; white-space: pre-line; }
  @media (max-width: 800px) { body.dev #panel { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div class="hand" id="hand1"></div>
    <div id="board"><canvas id="gl"></canvas><canvas id="overlay"></canvas></div>
  </div>
  <div id="panel">
    <div class="pop">
      <div class="pop-title gt">Battle</div>
      <div class="pop-body">
        <div class="row">
          <button id="btnPlay" data-sk="green">Pause</button>
          <button id="btnStep">Step</button>
          <button id="speed" title="Simulation speed">1x</button>
          <button id="btnReset" data-sk="orange">Restart</button>
        </div>
        <div class="row">
          <label class="lbl">Seed <input id="seed" type="number" value="1"></label>
          <button id="btnInf" class="toggle" data-sk="purple">Infinite elixir</button>
          <button id="btnSound" class="toggle on" title="Game sound (starts with the first click)">Sound</button>
        </div>
        <div class="row">
          <button id="aiBlue" class="toggle" title="Scripted AI for the blue side (click to change level)">Blue AI: off</button>
          <button id="aiRed" class="toggle" data-sk="red" title="Scripted AI for the red side (click to change level)">Red AI: off</button>
        </div>
        <div class="row">
          <button id="emoteRed" data-sk="red" title="Send the red side's next emote (the AI never emotes)">Red emote</button>
        </div>
      </div>
    </div>
    <div class="pop">
      <div class="pop-title gt">Spawn a card</div>
      <div class="pop-body">
        <div class="hint">Drag any card onto the arena for either side.</div>
        <div class="row"><button id="palBlue" class="toggle on">Blue</button><button id="palRed" class="toggle" data-sk="red">Red</button></div>
        <div class="palette" id="palette"></div>
      </div>
    </div>
    <div class="pop">
      <div class="pop-title gt">Status</div>
      <div class="pop-body"><div id="status"></div></div>
    </div>
  </div>
</div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
