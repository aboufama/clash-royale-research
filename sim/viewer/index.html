<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Clash Royale Sim</title>
<style>
  :root { --bg: #10141c; --panel: #1b2230; --text: #e8ecf3; --muted: #93a0b5; --blue: #3a8bff; --red: #ff4d4d; --elixir: #d43cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  #app { display: flex; height: 100%; }
  #stage { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  #board { position: relative; flex: 1; width: 100%; min-height: 0; }
  #board canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .hand { display: flex; gap: 6px; align-items: flex-end; padding: 6px 8px; width: 100%; max-width: 560px; justify-content: center; background: linear-gradient(#2a3346, #1b2230); }
  .hand.red { background: linear-gradient(#462a2a, #301b1b); }
  .card { position: relative; width: 72px; height: 88px; border-radius: 8px; background: #2c3650 center/contain no-repeat; border: 2px solid #5a6a8c; cursor: grab; display: flex; align-items: flex-end; justify-content: center; font-size: 10px; text-align: center; color: #fff; text-shadow: 0 1px 2px #000; overflow: hidden; }
  .card.next { width: 44px; height: 54px; opacity: .85; cursor: default; }
  .card.disabled { filter: grayscale(.9) brightness(.6); cursor: not-allowed; }
  .card .cost { position: absolute; left: -2px; top: -2px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(#ff7cff, var(--elixir)); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .card .name { padding: 2px; background: rgba(0,0,0,.35); width: 100%; }
  .elixir { flex: 1; max-width: 200px; display: flex; flex-direction: column; gap: 3px; margin-left: 4px; }
  .elixir .bar { height: 16px; border-radius: 8px; background: #2a1438; overflow: hidden; position: relative; border: 1px solid #000; }
  .elixir .fill { position: absolute; inset: 0; width: 0; background: linear-gradient(90deg, #b026ff, #f07cff); }
  .elixir .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0,0,0,.45) calc(10% - 1px) 10%); }
  .elixir .num { font-weight: 700; font-size: 15px; color: #f3b6ff; }
  #panel { width: 300px; background: var(--panel); padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #000; }
  #panel h3 { margin: 4px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select, input { background: #2c3650; color: var(--text); border: 1px solid #45526e; border-radius: 6px; padding: 5px 8px; font: inherit; }
  button.on { background: #3a5fa0; }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .palette .card { width: 100%; height: 64px; font-size: 9px; }
  #status { font-size: 12px; color: var(--muted); white-space: pre-line; }
  @media (max-width: 800px) { #panel { display: none; } }
  @media (max-width: 520px) {
    .hand { gap: 3px; padding: 4px; }
    .card { width: 15vw; height: 18.5vw; }
    .card.next { width: 9vw; height: 11vw; }
    .elixir { min-width: 22vw; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div class="hand red" id="hand1"></div>
    <div id="board"><canvas id="gl"></canvas><canvas id="overlay"></canvas></div>
    <div class="hand" id="hand0"></div>
  </div>
  <div id="panel">
    <div>
      <h3>Match</h3>
      <div class="row">
        <button id="btnPlay">Pause</button>
        <button id="btnStep">Step</button>
        <select id="speed">
          <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option>
          <option value="2">2x</option><option value="4">4x</option><option value="10">10x</option>
        </select>
        <button id="btnReset">Restart</button>
      </div>
      <div class="row" style="margin-top:6px">
        <label>Seed <input id="seed" type="number" value="1" style="width:70px"></label>
        <button id="btnInf">Infinite elixir</button>
      </div>
    </div>
    <div>
      <h3>Spawn any card (drag onto the arena)</h3>
      <div class="row"><button id="palBlue" class="on">Blue</button><button id="palRed">Red</button></div>
      <div class="palette" id="palette"></div>
    </div>
    <div><h3>Status</h3><div id="status"></div></div>
  </div>
</div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
